name: video-watch-clean
run-name: "clean ${{ inputs.job_id || 'all' }}"

# يحذف فروع النتائج المؤقتة watch/* بعد ما Claude يحللها
# + تنظيف يومي احتياطي لأي فرع منسي
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "معرّف المهمة، أو all لحذف الكل"
        default: "all"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete result branches
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job_id || 'all' }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$JOB" = "all" ]; then
            refs=$(gh api "repos/$REPO/git/matching-refs/heads/watch/" --jq '.[].ref' | sed 's#^refs/##')
          else
            refs="heads/watch/$JOB"
          fi
          for r in $refs; do
            gh api -X DELETE "repos/$REPO/git/refs/$r" && echo "deleted $r" || echo "skip $r"
          done
